<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Solutions</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #ffa116;
          --easy: #00b8a3; --medium: #ffc01e; --hard: #ef4743; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; color: var(--accent); }
  header p { margin: 0 0 20px; color: var(--muted); }
  a { color: var(--text); }
  a:hover { color: var(--accent); }
  input { width: 100%; padding: 12px 14px; font: inherit; color: var(--text); background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #count { margin: 10px 0; color: var(--muted); font-size: 13px; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  td.tags { white-space: normal; color: var(--muted); font-size: 13px; }
  code { font-size: 13px; }
  .Easy { color: var(--easy); } .Medium { color: var(--medium); } .Hard { color: var(--hard); }
  td img { vertical-align: middle; }
</style>
</head>
<body>
<main>
  <header>
    <h1>LeetCode Solutions</h1>
    <p>Search by number, title, difficulty or pattern. <a href="https://github.com/Nahje4/LeetCode">Back to repo</a></p>
  </header>
  <label for="q" hidden>Search solutions</label>
  <input id="q" type="search" placeholder="e.g. 42, two sum, hard, sliding window" autofocus>
  <div id="count" aria-live="polite"></div>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>Problem</th><th>Difficulty</th><th>Pattern</th><th>Solution</th><th>Time</th><th>Space</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<!-- DATA:START -->
<script id="data" type="application/json">[{"id": "1", "title": "Two Sum", "slug": "two-sum", "difficulty": "Easy", "tags": ["Array", "Hash Table"], "langs": {"cpp": "https://github.com/Nahje4/LeetCode/blob/main/Easy/1.Two_Sum/solution.cc"}, "time": "O(n)", "space": "O(n)"}, {"id": "2", "title": "Add Two Numbers", "slug": "add-two-numbers", "difficulty": "Medium", "tags": ["Linked List", "Math", "Recursion"], "langs": {"cpp": "https://github.com/Nahje4/LeetCode/blob/main/Medium/2.Add_Two_Numbers/solution.cc"}, "time": "O(max(m, n))", "space": "O(max(m, n))"}, {"id": "3", "title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "difficulty": "Medium", "tags": ["Hash Table", "String", "Sliding Window"], "langs": {"cpp": "https://github.com/Nahje4/LeetCode/blob/main/Medium/3.Longest_Substring_Without_Repeating_Characters/solution.cc"}, "time": "O(n)", "space": "O(min(m, n))"}, {"id": "4", "title": "Median of Two Sorted Arrays", "slug": "median-of-two-sorted-arrays", "difficulty": "Hard", "tags": ["Array", "Binary Search", "Divide and Conquer"], "langs": {"cpp": "https://github.com/Nahje4/LeetCode/blob/main/Hard/4.Median_of_Two_Sorted_Arrays/solution.cc"}, "time": "O(log(min(m, n)))", "space": "O(1)"}, {"id": "5", "title": "Longest Palindromic Substring", "slug": "longest-palindromic-substring", "difficulty": "Medium", "tags": ["Two Pointers", "String", "Dynamic Programming", "Manacher"], "langs": {"cpp": "https://github.com/Nahje4/LeetCode/blob/main/Medium/5.Longest_Palindromic_Substring/solution.cc"}, "time": "O(n)", "space": "O(n)"}]</script>
<!-- DATA:END -->
<script>
  const problems = JSON.parse(document.getElementById("data").textContent);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const q = document.getElementById("q"), rows = document.getElementById("rows"), count = document.getElementById("count");

  function matches(p, terms) {
    const hay = [p.title, p.difficulty, ...p.tags].join(" ").toLowerCase();
    // number terms match the id exactly, so "1" doesn't also hit 10, 11, ...
    return terms.every(t => /^\d+$/.test(t) ? p.id === t : hay.includes(t));
  }

  function render() {
    const terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    const shown = problems.filter(p => matches(p, terms));
    rows.innerHTML = shown.map(p => `<tr>
      <td>${esc(p.id)}</td>
      <td><a href="https://leetcode.com/problems/${esc(p.slug)}/">${esc(p.title)}</a></td>
      <td class="${esc(p.difficulty)}">${esc(p.difficulty)}</td>
      <td class="tags">${esc(p.tags.join(", "))}</td>
      <td>${Object.entries(p.langs).map(([l, url]) =>
        `<a href="${esc(url)}"><img src="https://skillicons.dev/icons?i=${esc(l)}" width="20" alt="${esc(l)}"></a>`).join(" ")}</td>
      <td><code>${esc(p.time || "—")}</code></td>
      <td><code>${esc(p.space || "—")}</code></td>
    </tr>`).join("");
    count.textContent = `${shown.length} of ${problems.length} solutions`;
    history.replaceState(null, "", q.value ? `?q=${encodeURIComponent(q.value)}` : location.pathname);
  }

  q.value = new URLSearchParams(location.search).get("q") || "";
  q.addEventListener("input", render);
  render();
</script>
</body>
</html>
