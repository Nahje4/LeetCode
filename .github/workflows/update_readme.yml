name: Update README

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "scripts/leetcode_cache.json"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain README.md scripts/leetcode_cache.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/leetcode_cache.json
          git commit -m "docs: update README"
          git push
